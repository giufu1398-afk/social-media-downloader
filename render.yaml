services:
  # Main Social Downloader website
  - type: web
    name: socialdownloader
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.5.3 --activate && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://socialdownloader.space

  # Self-hosted media resolver
  - type: web
    name: media-resolver
    runtime: docker
    rootDir: deploy/resolver
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RESOLVER_SECRET
        generateValue: true
      - key: RESOLVER_API_KEY
        sync: false
      - key: RESOLVER_COOKIES
        sync: false
